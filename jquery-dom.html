
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4b - Question 3</title>

    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>

    <h1>jQuery DOM Manipulation</h1>

    <h2>Part (a): Modify Text</h2>
    <div id="myElement">Original Text</div>

    <h2>Part (b): Add CSS Class</h2>
    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <h2>Part (c): Button Click Event</h2>
    <button id="myButton" type="button">
        Click me
    </button>

    <script>
        $(document).ready(function () {

            // Part (a): Modify text
            $("#myElement").text("Modified Text");

            // Part (b): Add CSS class
            $("#myDIV").addClass("myStyle");

            // Part (c): Button click event
            $("#myButton").on("click", function () {
                alert("Button clicked!");
            });

        });
    </script>

</body>
</html>
