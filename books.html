
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4b - Question 2</title>
</head>
<body>

    <h1>Book Information</h1>

    <h2>Title of the First Book</h2>
    <p id="firstTitle">Loading...</p>

    <h2>Author of the Second Book</h2>
    <p id="secondAuthor">Loading...</p>

    <h2>Genres of Both Books</h2>
    <ul id="genreList"></ul>

    <p id="errorMessage" role="alert"></p>

    <script>
        async function loadBooks() {
            const firstTitle =
                document.getElementById("firstTitle");

            const secondAuthor =
                document.getElementById("secondAuthor");

            const genreList =
                document.getElementById("genreList");

            const errorMessage =
                document.getElementById("errorMessage");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Failed to load books.json");
                }

                const data = await response.json();

                if (!Array.isArray(data.books) ||
                    data.books.length < 2) {
                    throw new Error("Invalid book data");
                }

                const book1 = data.books[0];
                const book2 = data.books[1];

                firstTitle.textContent = book1.title;
                secondAuthor.textContent = book2.author;

                genreList.replaceChildren();

                for (const book of data.books) {
                    const listItem =
                        document.createElement("li");

                    listItem.textContent =
                        book.title + " — " +
                        book.genres.join(", ");

                    genreList.appendChild(listItem);
                }

            } catch (error) {
                firstTitle.textContent = "";
                secondAuthor.textContent = "";
                genreList.replaceChildren();

                errorMessage.textContent =
                    "Unable to load book information. " +
                    "Please check books.json and try again.";

                console.error(error);
            }
        }

        loadBooks();
    </script>

</body>
</html>
